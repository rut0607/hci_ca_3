<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1393" viewBox="0 0 1440 1393"><title>Help centre</title><rect width="1440" height="1393" fill="#ffffff"/><text x="-999" y="17.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2b2b2b">Skip to content</text><line x1="0" y1="69" x2="1440" y2="69" stroke="#c9c9c9" stroke-width="1"/><rect x="164" y="26" width="22" height="16" rx="3" fill="#4d4d4d"/><text x="194" y="41.7" font-family="Fraunces, Georgia, serif" font-size="22.4" font-weight="600" fill="#2b2b2b" textLength="105.5" lengthAdjust="spacingAndGlyphs">Showtime</text><text x="331.5" y="39.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#808080">Discover</text><text x="420.5" y="39.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#808080">Events</text><text x="494.6" y="39.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#808080">Saved</text><rect x="545.1" y="25.8" width="18" height="18" rx="9" fill="#4d4d4d"/><text x="550.6" y="38.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">3</text><text x="589.1" y="39.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#808080">My tickets</text><line x1="688.8" y1="51.2" x2="722.3" y2="51.2" stroke="#4d4d4d" stroke-width="2"/><text x="688.8" y="39.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="500" fill="#2b2b2b">Help</text><text x="1003.6" y="38.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#808080">For organizers</text><rect x="1114.8" y="15.2" width="70.7" height="37.7" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="1129.8" y="38.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2b2b2b">Log in</text><rect x="1195.5" y="15.2" width="80.5" height="37.7" rx="8" fill="#4d4d4d"/><text x="1210.5" y="38.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff">Sign up</text><text x="164" y="130" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#2b2b2b" textLength="203.1" lengthAdjust="spacingAndGlyphs">How can we</text><text x="374.4" y="130" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#2b2b2b" font-style="italic" textLength="67.9" lengthAdjust="spacingAndGlyphs">help</text><text x="442.3" y="130" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#2b2b2b" textLength="18.6" lengthAdjust="spacingAndGlyphs">?</text><rect x="164" y="158.4" width="560" height="73.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="181" y="181.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#808080">SEARCH HELP</text><text x="181" y="210.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8a8a8">e.g. refund, resend ticket</text><rect x="618" y="159.4" width="105" height="71.8" rx="0" fill="#4d4d4d"/><text x="645" y="200.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="500" fill="#ffffff">Search</text><text x="164" y="270.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#808080">Popular:</text><rect x="226.7" y="246.2" width="88.7" height="39.7" rx="19.84375" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="243.7" y="270.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2b2b2b">Refunds</text><rect x="323.3" y="246.2" width="99" height="39.7" rx="19.84375" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="340.3" y="270.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2b2b2b">Payments</text><rect x="430.3" y="246.2" width="81.8" height="39.7" rx="19.84375" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="447.3" y="270.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2b2b2b">Tickets</text><rect x="520.1" y="246.2" width="106.2" height="39.7" rx="19.84375" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="537.1" y="270.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2b2b2b">Organizers</text><text x="164" y="345.3" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#2b2b2b" textLength="210.8" lengthAdjust="spacingAndGlyphs">Frequently asked</text><rect x="164" y="365.8" width="712" height="124.4" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="400.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">How do I get my ticket after booking?</text><text x="185" y="441.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Your e-ticket is emailed instantly and saved under My tickets. Show the QR code at the</text><text x="185" y="466.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">entrance, even offline.</text><rect x="164" y="500.2" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="535" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">Can I cancel and get a refund?</text><text x="185" y="575.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Yes. Cancel free up to 48 hours before the event from My tickets. Refunds reach your</text><text x="185" y="600.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">original payment method in 5 to 7 working days.</text><rect x="164" y="569" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="603.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">My payment failed. Was I charged?</text><text x="185" y="644.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">No. If a payment fails, nothing is charged and your tickets stay held for the remaining</text><text x="185" y="669.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">hold time so you can retry or switch to UPI or net banking.</text><rect x="164" y="637.8" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="672.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">How long are tickets held while I pay?</text><text x="185" y="713.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Ten minutes from when you open the ticket page. The timer is always visible. If it runs</text><text x="185" y="738.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">out, your choices are kept and you can start a new hold.</text><rect x="164" y="706.6" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="741.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">Can I choose my seat?</text><text x="185" y="782.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">For Premium seated tickets, yes. After adding them, pick your seats on the map. Taken</text><text x="185" y="806.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">seats are greyed out.</text><rect x="164" y="775.4" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="810.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">Can I transfer tickets to a friend?</text><text x="185" y="850.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Open the ticket in My tickets and choose Share. Your friend receives their own QR code.</text><rect x="164" y="844.2" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="878.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">I didn’t get the confirmation email.</text><text x="185" y="919.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Check your spam folder first. Your ticket is always available in My tickets, and you can</text><text x="185" y="944.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">download it from there.</text><rect x="164" y="913" width="712" height="58.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="185" y="947.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2b2b2b">How do I list my own event as an organizer?</text><text x="185" y="988.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">Go to For organizers, create an event in four steps and publish it. It appears on Events</text><text x="185" y="1013.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#808080">straight away and you can track sales on your dashboard.</text><rect x="916" y="321.9" width="360" height="556.7" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="943" y="367.9" font-family="Fraunces, Georgia, serif" font-size="20.8" font-weight="600" fill="#2b2b2b" textLength="148.5" lengthAdjust="spacingAndGlyphs">Still need help?</text><text x="943" y="398.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#808080">Send us a message and we’ll reply within 24</text><text x="943" y="420.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#808080">hours.</text><text x="943" y="456.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2b2b2b">Email</text><rect x="943" y="468.3" width="306" height="48.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="943" y="550.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2b2b2b">Booking ID</text><text x="1019" y="550.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#808080">(optional)</text><rect x="943" y="562.8" width="306" height="48.8" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><text x="955" y="592.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8a8a8">SHT-000000</text><text x="943" y="645.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2b2b2b">Message</text><rect x="943" y="657.3" width="306" height="120" rx="8" fill="#fff" stroke="#9b9b9b" stroke-width="1"/><rect x="943" y="802" width="306" height="49.6" rx="8" fill="#4d4d4d"/><text x="1042.4" y="832" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="500" fill="#ffffff">Send message</text><line x1="0" y1="1126.1" x2="1440" y2="1126.1" stroke="#c9c9c9" stroke-width="1"/><rect x="164" y="1184.4" width="22" height="16" rx="3" fill="#4d4d4d"/><text x="194" y="1200.1" font-family="Fraunces, Georgia, serif" font-size="22.4" font-weight="600" fill="#2b2b2b" textLength="105.5" lengthAdjust="spacingAndGlyphs">Showtime</text><text x="164" y="1237.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Find and book live events with clear</text><text x="164" y="1259.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">prices and no surprises.</text><text x="549.4" y="1185.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2b2b2b">EXPLORE</text><text x="549.4" y="1216.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">All events</text><text x="549.4" y="1246.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Saved</text><text x="549.4" y="1277.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">My tickets</text><text x="802.3" y="1185.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2b2b2b">ORGANIZERS</text><text x="802.3" y="1216.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Dashboard</text><text x="802.3" y="1246.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Create an event</text><text x="1055.1" y="1185.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2b2b2b">SUPPORT</text><text x="1055.1" y="1216.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Help centre</text><text x="1055.1" y="1246.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">User flow</text><text x="1055.1" y="1277.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.4" font-weight="400" fill="#808080">Terms &amp; privacy</text><line x1="164" y1="1323.9" x2="1276" y2="1323.9" stroke="#c9c9c9" stroke-width="1"/><text x="164" y="1359.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#808080">© 2026 Showtime · HCI CA-3 design project</text><text x="1119" y="1359.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#808080">Made with care for clarity</text></svg>